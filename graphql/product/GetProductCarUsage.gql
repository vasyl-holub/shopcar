query GetProductCarUsage($id: ID!) {
  product(id: $id) {
    cars {
      edges {
        id
        name
        yearStart
        model {
          id
          slug
          name
          yearStart
          yearEnd
          body {
            id
            name
          }
          brand {
            id
            name
          }
        }
      }
    }
  }
}